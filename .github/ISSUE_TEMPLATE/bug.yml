name: Bug
description: Something does not work as expected
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should have happened
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. ...\n2. ..."
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where
      placeholder: e.g. android/core-vision, ml/train.py, phone model, commit hash
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Never paste API keys or personal data.
